<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>samburu_chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2D7CFF;
            --primary-light: #60A5FA;
            --primary-dark: #0052CC;
            --success-color: #10B981;
            --accent-color: #8B5CF6;
            --bg-color: #000000;
            --card-bg: rgba(10, 10, 10, 0.95);
            --dark-text: #FFFFFF;
            --light-text: #FFFFFF;
            --muted-text: #BBBBBB;
            --user-message-bg: #2D7CFF;
            --bot-message-bg: rgba(34, 34, 34, 0.95);
            --border-color: #333333;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
            --input-bg: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--dark-text);
            line-height: 1.5;
            overflow: hidden;
            display: flex;
        }

        .page-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .video-side {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .video-side video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-column {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background-color: var(--card-bg);
            box-shadow: var(--shadow-lg);
            position: relative;
            border: 1px solid var(--border-color);
        }

        .header {
            background-color: rgba(10, 10, 10, 0.95);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .header h2 {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--light-text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h2::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--primary-color);
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .language-selector select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            font-size: 0.9rem;
            color: var(--light-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .language-selector select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(45, 124, 255, 0.3);
        }

        .language-selector select option {
            background-color: var(--input-bg);
            color: var(--light-text);
        }

        .messages-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: rgba(0, 0, 0, 0.8);
            scroll-behavior: smooth;
            position: relative;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
            position: relative;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-message-bg);
            color: var(--light-text);
            border-radius: 14px 14px 0 14px;
            box-shadow: var(--shadow-sm);
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-message-bg);
            color: var(--light-text);
            border-radius: 14px 14px 14px 0;
            box-shadow: var(--shadow-sm);
        }

        .input-container {
            padding: 20px 24px;
            background-color: rgba(10, 10, 10, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            position: relative;
        }

        .message-input-wrapper {
            flex-grow: 1;
            position: relative;
            background: var(--input-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .message-input-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(45, 124, 255, 0.2);
        }

        .message-input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            resize: none;
            max-height: 150px;
            min-height: 24px;
            color: var(--light-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.5;
        }

        .message-input:focus {
            outline: none;
        }

        .message-input::placeholder {
            color: var(--muted-text);
        }

        .send-button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .send-button:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-button:disabled {
            background-color: #444444;
            opacity: 0.7;
            cursor: not-allowed;
        }

        .thinking {
            display: flex;
            gap: 4px;
            padding: 10px;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-light);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Custom scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .messages-container::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 6px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background-color: var(--muted-text);
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .video-side {
                flex: 0.7;
            }
            
            .chat-column {
                flex: 2.6;
            }
        }

        @media (max-width: 900px) {
            .page-container {
                flex-direction: column;
            }
            
            .video-side {
                display: none;
            }
            
            .chat-column {
                width: 100%;
                padding: 0;
            }
            
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Left video side -->
        <div class="video-side">
            <video autoplay="" loop="" muted="" playsinline="">
                <source src="vid.mp4" type="video/mp4">
            </video>
        </div>
        
        <!-- Chat area in the middle -->
        <div class="chat-column">
            <div class="chat-container">
                <div class="header">
                    <h2>samburu_chatbot</h2>
                    <div class="language-selector">
                        <select id="languageSelect">
                            <option value="kinyarwanda">Kinyarwanda</option>
                            <option value="maasai">Maasai</option>
                            <option value="samburu">Samburu</option>
                            <option value="kirundi">Kirundi</option>
                        </select>
                    </div>
                </div>
                
                <div class="messages-container" id="messagesContainer">
                    <div class="message bot-message">
                        Hello! How can I assist you today? You can chat with me in Samburu.
                    </div>
                </div>
                
                <div class="input-container">
                    <div class="message-input-wrapper">
                        <textarea id="messageInput" class="message-input" placeholder="Type a message..." rows="1" oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 150) + 'px'"></textarea>
                    </div>
                    <button id="sendButton" class="send-button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Right video side -->
        <div class="video-side">
            <video autoplay="" loop="" muted="" playsinline="">
                <source src="vid.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const languageSelect = document.getElementById('languageSelect');
            
            // Handle Enter key to send message
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            sendButton.addEventListener('click', sendMessage);
            
            function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;
                
                // Add user message to chat
                addMessage(message, 'user');
                
                // Clear input field
                messageInput.value = '';
                messageInput.style.height = '';
                
                // Show thinking animation
                const thinkingElement = document.createElement('div');
                thinkingElement.className = 'message bot-message thinking';
                thinkingElement.innerHTML = `
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                `;
                messagesContainer.appendChild(thinkingElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                // Disable send button during request
                sendButton.disabled = true;
                
                // Prepare data for the request
                const language = languageSelect.value;
                const data = new URLSearchParams();
                data.append('message', message);
                data.append('language', language);
                
                // Make the API request
                fetch('https://samburu-chatbot.onrender.com/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: data
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Remove thinking animation
                    messagesContainer.removeChild(thinkingElement);
                    
                    if (data.success) {
                        const messages = data.message.map(entry => {
                            if (entry.error) return entry.error;
                            return `
                                Samburu: ${entry.samburu}
                                Transcription: ${entry.transcription}
                                POS: ${entry.pos}
                                Features: ${entry.inflectionfeatures}
                                English: ${entry.english}
                            `;
                        }).join('\n\n');
                        addMessage(messages, 'bot');
                    }
                })
                .catch(error => {
                    // Remove thinking animation
                    messagesContainer.removeChild(thinkingElement);
                    
                    console.error('Error:', error);
                    addMessage(`Something went wrong. Please try again.`, 'bot');
                })
                .finally(() => {
                    sendButton.disabled = false;
                });
            }
            
            function addMessage(text, sender) {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${sender}-message`;
                messageElement.textContent = text;
                messagesContainer.appendChild(messageElement);
                
                // Scroll to the bottom to show the latest message
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            
            // Ensure videos autoplay
            document.querySelectorAll('video').forEach(video => {
                video.play().catch(error => {
                    console.log("Video autoplay failed:", error);
                });
            });
        });
    </script>
</body>
</html>
